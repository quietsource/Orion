name: Build desktop distributions

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_name: Orion-linux-x64
            build_args: --linux AppImage deb rpm --x64
            package_glob: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
          - runner: windows-2025
            artifact_name: Orion-windows-x64
            build_args: --win nsis portable --x64
            package_glob: release/*.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify application
        run: bun run test

      - name: Install headless display for Linux smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb

      - name: Package for this operating system
        shell: bash
        run: |
          if [[ -n "$ORION_WIN_CSC_LINK" ]]; then export WIN_CSC_LINK="$ORION_WIN_CSC_LINK"; fi
          if [[ -n "$ORION_WIN_CSC_KEY_PASSWORD" ]]; then export WIN_CSC_KEY_PASSWORD="$ORION_WIN_CSC_KEY_PASSWORD"; fi
          bunx --bun electron-builder ${{ matrix.build_args }} --publish never
        env:
          ORION_WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          ORION_WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Smoke test Windows NSIS installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter 'Orion Setup *.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'The NSIS setup executable was not produced.' }

          $installDir = Join-Path $env:RUNNER_TEMP 'Orion-Installer-Smoke'
          $arguments = "/S /D=$installDir"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $arguments -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'The NSIS installer did not finish within two minutes.'
          }
          if ($process.ExitCode -ne 0) { throw "The NSIS installer exited with code $($process.ExitCode)." }

          $appExecutable = Join-Path $installDir 'Orion.exe'
          $appArchive = Join-Path $installDir 'resources/app.asar'
          if (-not (Test-Path -LiteralPath $appExecutable -PathType Leaf)) { throw "Installed executable not found: $appExecutable" }
          if (-not (Test-Path -LiteralPath $appArchive -PathType Leaf)) { throw "Installed application archive not found: $appArchive" }
          Get-Item -LiteralPath $appExecutable, $appArchive | Select-Object FullName, Length
          bun scripts/smoke-packaged.mjs $appExecutable

      - name: Smoke test Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          xvfb-run -a bun scripts/smoke-packaged.mjs "$appimage" --appimage-extract-and-run --no-sandbox

      - name: Create package checksums
        run: bun run checksums

      - name: Upload distribution artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.package_glob }}
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Orion-*
          path: release-artifacts

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import shutil
          from pathlib import Path

          root = Path("release-artifacts")
          output = Path("release-assets")
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as source:
                  for block in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          expected = {
              "Orion-linux-x64": {".AppImage": 1, ".deb": 1, ".rpm": 1},
              "Orion-windows-x64": {".exe": 2},
          }
          output.mkdir(parents=True, exist_ok=True)
          hashes = {}
          for artifact, suffix_counts in expected.items():
              directory = root / artifact
              if not directory.is_dir():
                  raise SystemExit(f"Missing platform build artifact: {artifact}")
              files = [item for item in directory.iterdir() if item.is_file()]
              packages = [item for item in files if item.suffix in {".AppImage", ".deb", ".dmg", ".exe", ".rpm", ".zip"}]
              for suffix, minimum in suffix_counts.items():
                  count = sum(item.suffix == suffix for item in packages)
                  if count < minimum:
                      raise SystemExit(f"{artifact} is missing {suffix} package(s): expected at least {minimum}, found {count}")
              manifest = directory / "SHA256SUMS"
              if not manifest.is_file():
                  raise SystemExit(f"{artifact} is missing its package checksum manifest")
              listed = set()
              for line in manifest.read_text(encoding="utf-8").splitlines():
                  digest, separator, filename = line.partition("  ")
                  package = directory / filename
                  if not separator or package.name != filename or not package.is_file():
                      raise SystemExit(f"Invalid checksum entry in {manifest}: {line}")
                  actual = sha256(package)
                  if actual != digest:
                      raise SystemExit(f"Checksum mismatch for {artifact}/{filename}")
                  if filename in hashes:
                      raise SystemExit(f"Duplicate release filename: {filename}")
                  listed.add(filename)
                  hashes[filename] = actual
                  shutil.copy2(package, output / filename)
              if listed != {item.name for item in packages}:
                  raise SystemExit(f"Checksum manifest does not cover every package in {artifact}")

          lines = [f"{digest}  {filename}" for filename, digest in sorted(hashes.items())]
          (output / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Verified and staged {len(hashes)} release packages.")
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --verify-tag --generate-notes --title "Orion $TAG_NAME"
          fi
          while IFS= read -r asset; do
            if [[ -n "$asset" && ! -f "release-assets/$asset" ]]; then
              gh release delete-asset "$TAG_NAME" "$asset" --yes
            fi
          done < <(gh release view "$TAG_NAME" --json assets --jq '.assets[].name')
          gh release upload "$TAG_NAME" release-assets/* --clobber
